name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, build & tests
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (with the version as comment) to
      # prevent supply-chain attacks through mutable tags.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Oxlint
        run: bunx --bun oxlint .

      - name: ESLint
        run: bunx --bun eslint . --max-warnings=0

      # `bunx --bun vue-tsc` runs on the Bun runtime and silently misses type
      # errors; use the Node-routed script instead.
      - name: Type-check
        run: bun run type-check

      - name: Build
        run: bun run build

      - name: Tests & coverage
        run: bun test:coverage
